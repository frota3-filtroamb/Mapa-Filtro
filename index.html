// ===============================
// FROTA SASCAR VIA KML
// ===============================
// Como usar:
// 1) No portal Sascar, exporte Google Earth (KML)
// 2) Clique em "Importar KML Sascar" e selecione o arquivo
// 3) Ou coloque location.kml na mesma pasta do HTML e abra via servidor local

let marcadoresCaminhoes = [];
let caminhoes = [];
let placaSelecionada = null;
let circuloCaminhao = null;
let currentMarkers = [];

const iconeCaminhao = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/3097/3097180.png",
  iconSize: [42, 42],
  iconAnchor: [21, 21],
  popupAnchor: [0, -20]
});

function decodeHtml(html) {
  const txt = document.createElement('textarea');
  txt.innerHTML = html;
  return txt.value;
}

function extrairCampo(descHtml, nome) {
  const d = decodeHtml(descHtml);
  const re = new RegExp('<b>' + nome + ':<\\/b><\\/td>\\s*<td>(.*?)<\\/td>', 'i');
  const m = d.match(re);
  return m ? m[1].trim() : '';
}

function parseVelocidade(txt) {
  const m = String(txt).match(/([\d.,]+)/);
  return m ? parseFloat(m[1].replace(',', '.')) : 0;
}

/** Lê o KML exportado pela Sascar e devolve lista de caminhões */
function parseKmlSascar(kmlText) {
  const parser = new DOMParser();
  const xml = parser.parseFromString(kmlText, 'text/xml');
  const placemarks = xml.getElementsByTagName('Placemark');
  const lista = [];

  for (let i = 0; i < placemarks.length; i++) {
    const pm = placemarks[i];
    const descNode = pm.getElementsByTagName('description')[0];
    const coordNode = pm.getElementsByTagName('coordinates')[0];
    if (!descNode || !coordNode) continue;

    const desc = descNode.textContent || '';
    const coordTxt = (coordNode.textContent || '').trim();
    const parts = coordTxt.split(',');
    if (parts.length < 2) continue;

    const lng = parseFloat(parts[0]);
    const lat = parseFloat(parts[1]);
    if (isNaN(lat) || isNaN(lng)) continue;

    const placa = extrairCampo(desc, 'Placa');
    if (!placa) continue;

    const municipio = extrairCampo(desc, 'Município') || extrairCampo(desc, 'Municipio');
    const estado = extrairCampo(desc, 'Estado');
    const rua = extrairCampo(desc, 'Rua');
    const ignTxt = extrairCampo(desc, 'Ignição') || extrairCampo(desc, 'Ignicao');
    const velTxt = extrairCampo(desc, 'Velocidade');
    const data = extrairCampo(desc, 'Data');
    const motorista = extrairCampo(desc, 'Motorista');
    const bateria = extrairCampo(desc, 'Bateria (V)') || extrairCampo(desc, 'Bateria');

    lista.push({
      placa: placa.toUpperCase(),
      cidade: [municipio, estado].filter(Boolean).join(' - ') || '—',
      rua: rua || '',
      lat,
      lng,
      ignicao: /ligada/i.test(ignTxt),
      velocidade: parseVelocidade(velTxt),
      data: data || '',
      motorista: motorista || '',
      bateria: bateria || ''
    });
  }

  return lista;
}

function popupCaminhao(c) {
  return `
    <b>🚚 ${c.placa}</b><br>
    📍 ${c.cidade}${c.rua ? '<br>🛣 ' + c.rua : ''}<br>
    ⚡ Ignição: ${c.ignicao ? 'Ligada' : 'Desligada'}<br>
    🏎️ Velocidade: ${c.velocidade} km/h
    ${c.data ? '<br>🕒 ' + c.data : ''}
  `;
}

function atualizarPainelSeAberto(c) {
  if (!placaSelecionada || placaSelecionada !== c.placa) return;
  document.getElementById("infoPlaca").innerText = c.placa;
  document.getElementById("infoCidade").innerText = c.cidade;
  document.getElementById("infoIgnicao").innerText =
    c.ignicao ? "🟢 Ligada" : "🔴 Desligada";
  document.getElementById("infoVelocidade").innerText = c.velocidade + " km/h";
}

function limparMarcadoresCaminhoes() {
  marcadoresCaminhoes.forEach(item => {
    map.removeLayer(item.marker);
  });
  marcadoresCaminhoes = [];
}

async function carregarVeiculosCSV() {

    const resposta = await fetch("./dados/veiculos.csv");
    const texto = await resposta.text();

    const linhas = texto.trim().split("\n");

    // Remove o cabeçalho
    linhas.shift();

    const mapaVeiculos = {};

    linhas.forEach(linha => {

        const c = linha.split(";");

        const placa = c[1];

        mapaVeiculos[placa] = {

            placa: placa,

            lat: parseFloat(c[2]),

            lng: parseFloat(c[3]),

            velocidade: Number(c[4]),

            ignicao: c[7] === "True",

            data: c[8],

            rua: c[10],

            cidade: c[11],

            uf: c[12]

        };

    });

    const lista = Object.values(mapaVeiculos);

    console.log(lista);

    sincronizarMarcadores(lista);

}

function sincronizarMarcadores(lista) {
  caminhoes = lista;
  limparMarcadoresCaminhoes();

  lista.forEach(c => {
    const marker = L.marker([c.lat, c.lng], { icon: iconeCaminhao }).addTo(map);
    marker.bindPopup(popupCaminhao(c));
    marker.on('click', () => abrirPainelCaminhao(c.placa));
    marcadoresCaminhoes.push({ placa: c.placa, marker });
    atualizarPainelSeAberto(c);
  });

  // se painel aberto, reposiciona círculo
  if (placaSelecionada) {
    const dados = caminhoes.find(c => c.placa === placaSelecionada);
    if (dados && circuloCaminhao) {
      circuloCaminhao.setLatLng([dados.lat, dados.lng]);
    }
  }

  const badge = document.getElementById('statusFrota');
  if (badge) {
    const agora = new Date().toLocaleTimeString('pt-BR');
    badge.textContent = `● Sascar KML · ${lista.length} veículos · ${agora}`;
  }
}

function carregarFrotaDoKml(kmlText) {
  try {
    const lista = parseKmlSascar(kmlText);
    if (!lista.length) {
      alert('Nenhum veículo encontrado neste KML.');
      return;
    }
    sincronizarMarcadores(lista);
  } catch (e) {
    console.error(e);
    alert('Erro ao ler o arquivo KML. Verifique se é o export Google Earth da Sascar.');
  }
}

function onKmlFileSelected(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => carregarFrotaDoKml(String(reader.result || ''));
  reader.readAsText(file);
}

/** Tenta carregar location.kml da mesma pasta (só funciona em servidor local/http) */
async function tentarCarregarKmlLocal() {
  try {
    const res = await fetch('location.kml', { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    if (text.includes('<Placemark>')) {
      carregarFrotaDoKml(text);
    }
  } catch (e) {
    // arquivo local sem servidor: normal — use o botão Importar
  }
}

  const item = marcadoresCaminhoes.find(m => m.placa === placaSelecionada);

}

        {nome: "L&H Implementos Rodoviários", tipo: "GUINCHO", coords: [-23.9894, -46.4799], endereco: "São Vicente - SP"},
        {nome: "Oficina Zé do Guincho", tipo: "GUINCHO", coords: [-23.9910, -46.4933], endereco: "São Vicente - SP"}
      ]
    };

    const tipoCores = {
      "ELETRICA": "#e74c3c",
      "MECANICA": "#3498db",
      "TACOGRAFO": "#9b59b6",
      "LAVAÇÃO": "#1abc9c",
      "AUTOPEÇA": "#f39c12",
      "BORRACHARIA": "#e67e22",
      "GUINCHO": "#2ecc71"
    };

    const tipoDescricao = {
      "ELETRICA": "Eletrica",
      "MECANICA": "Mecanica",
      "TACOGRAFO": "Tacografo",
      "LAVAÇÃO": "Lavacao",
      "AUTOPEÇA": "Autopeça",
      "BORRACHARIA": "Borracharia",
      "GUINCHO": "Guincho"
    }; 
    
    const tbodyUn = document.querySelector('#unidadesTable tbody');

      row.onclick = () => {
        clearMarkers();
        map.flyTo(u.coords, 12);
        const icon = u.grande ? grandeIcon : L.icon({iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png', iconSize: [22,32]});
        const m = L.marker(u.coords, {icon}).addTo(map).bindPopup(`<b>${u.nome}</b><br>${u.cidade}`);
        currentMarkers.push(m);
        if (oficinasPorUnidade[u.nome]) addOficinas(oficinasPorUnidade[u.nome]);
      };
    });

    const todasOficinas = Object.values(oficinasPorUnidade).flat().sort((a, b) => a.nome.localeCompare(b.nome));
    const tbodyOf = document.querySelector('#oficinasTable tbody');
    todasOficinas.forEach(p => {
      const row = tbodyOf.insertRow();
      row.innerHTML = `<td><strong>${p.nome}</strong><br><small>${p.tipo}</small></td>`;
      row.onclick = () => {
        clearMarkers();
        map.flyTo(p.coords, 14);
        addOfficePopup(p);
      };
    });

    // Filtro da legenda: null = mostra todos os tipos
    let filtroTipo = null;

    function aplicarFiltroOficinas() {
      marcadoresOficinas.forEach(item => {
        const tipo = item.dados.tipo;
        const mostrar = !filtroTipo || tipo === filtroTipo;
        if (mostrar) {
          if (!map.hasLayer(item.marker)) {
            item.marker.addTo(map);
          }
        } else {
          if (map.hasLayer(item.marker)) {
            map.removeLayer(item.marker);
          }
        }
      });

      // Atualiza visual da legenda
      document.querySelectorAll('.map-legend-item[data-tipo]').forEach(el => {
        const t = el.getAttribute('data-tipo');
        el.classList.remove('ativo-filtro', 'inativo');
        if (filtroTipo) {
          if (t === filtroTipo) el.classList.add('ativo-filtro');
          else el.classList.add('inativo');
        }
      });
    }

    function selecionarFiltroTipo(tipo) {
      // Clica de novo no mesmo tipo → volta a mostrar todos
      if (filtroTipo === tipo) {
        filtroTipo = null;
      } else {
        filtroTipo = tipo;
      }
      aplicarFiltroOficinas();
    }

    function limparFiltroTipo() {
      filtroTipo = null;
      aplicarFiltroOficinas();
    }

    const legendDiv = document.getElementById('legend');
    Object.keys(tipoCores).forEach(tipo => {
      const item = document.createElement('div');
      item.className = 'map-legend-item';
      item.setAttribute('data-tipo', tipo);
      item.title = 'Clique para filtrar: ' + tipoDescricao[tipo];
      item.innerHTML = `<div class="map-legend-color" style="background:${tipoCores[tipo]}"></div><span>${tipoDescricao[tipo]}</span>`;
      item.onclick = () => selecionarFiltroTipo(tipo);
      legendDiv.appendChild(item);
    });

    const todos = document.createElement('div');
    todos.className = 'map-legend-todos';
    todos.textContent = '↺ Mostrar todos';
    todos.onclick = limparFiltroTipo;
    legendDiv.appendChild(todos);

    function popupHtml(p) {
      const mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.nome + ' ' + (p.endereco || ''))}`;
      const imageUrl = imgByType[p.tipo] || imgByType.MECANICA;
      return `
        <div class="gm-popup">
          <img class="gm-img" src="${imageUrl}" alt="${p.nome}">
          <div class="gm-title">${p.nome}</div>
          <div class="gm-sub">${p.endereco || ''}<br>Tipo: ${p.tipo}</div>
          <a class="gm-link" href="${mapLink}" target="_blank">Abrir no Google Maps</a>
        </div>
      `;
    }

    function addOfficePopup(p) {
      const cor = tipoCores[p.tipo] || "#555";
      const m = L.circleMarker(p.coords, {
        radius: 8, color: cor, fillColor: cor, fillOpacity: 0.9, weight: 2
      }).bindPopup(popupHtml(p));
      if (!filtroTipo || p.tipo === filtroTipo) {
        m.addTo(map);
      }
      currentMarkers.push(m);
      marcadoresOficinas.push({ marker: m, dados: p });
      m.openPopup();
    }

    function clearMarkers() {
      currentMarkers.forEach(m => map.removeLayer(m));
      currentMarkers = [];
      marcadoresOficinas = [];
    }

function addOficinas(lista, posicao) {

    marcadoresOficinas = [];

    lista.forEach(p => {

        const cor = tipoCores[p.tipo] || "#555";

        let distancia = Infinity;

        if (posicao) {
            distancia = calcularDistancia(
                posicao.lat,
                posicao.lng,
                p.coords[0],
                p.coords[1]
            );
        }

        const oficinaMaisProxima = posicao
            ? encontrarOficinaMaisProxima(posicao.lat, posicao.lng).oficina
            : null;

        const ehMaisProxima =
            oficinaMaisProxima &&
            oficinaMaisProxima.nome === p.nome;


        const m = L.circleMarker(p.coords, {
            radius: ehMaisProxima ? 10 : 7,
            color: cor,
            fillColor: cor,
            fillOpacity: 0.9,
            weight: ehMaisProxima ? 3 : 2
        }).bindPopup(popupHtml(p));

        if (!filtroTipo || p.tipo === filtroTipo) {
            m.addTo(map);
        }

        currentMarkers.push(m);

        marcadoresOficinas.push({
            marker: m,
            dados: p
        });

    });

}

function calcularDistancia(lat1, lon1, lat2, lon2) {

    const R = 6371; // km

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;

}

function encontrarOficinaMaisProxima(lat, lng){

    let oficinaMaisProxima = null;
    let menorDistancia = Infinity;

    Object.values(oficinasPorUnidade).flat().forEach(oficina => {

        const distancia = calcularDistancia(
            lat,
            lng,
            oficina.coords[0],
            oficina.coords[1]
        );

        if(distancia < menorDistancia){

            menorDistancia = distancia;
            oficinaMaisProxima = oficina;

        }

    });

    return {
        oficina: oficinaMaisProxima,
        distancia: menorDistancia
    };

}

function mostrarOficinasProximas(lat, lng){

    // Monta lista com distância
    const lista = Object.values(oficinasPorUnidade).flat().map(oficina => {
        const distancia = calcularDistancia(
            lat,
            lng,
            oficina.coords[0],
            oficina.coords[1]
        );
        return { ...oficina, distancia };
    });

    // Pega só a mais próxima de CADA tipo
    const maisProximaPorTipo = {};
    lista.forEach(oficina => {
        const tipo = oficina.tipo;
        if (!maisProximaPorTipo[tipo] || oficina.distancia < maisProximaPorTipo[tipo].distancia) {
            maisProximaPorTipo[tipo] = oficina;
        }
    });

    // Ordena os tipos pela distância (mais perto primeiro)
    const resultado = Object.values(maisProximaPorTipo)
        .sort((a, b) => a.distancia - b.distancia);

    const div = document.getElementById("listaOficinas");
    div.innerHTML = "";

    if (!resultado.length) {
        div.innerHTML = '<div class="oficinaDistancia">Nenhuma oficina cadastrada.</div>';
        return;
    }

    resultado.forEach((oficina, idx) => {
        const nomeTipo = (tipoDescricao[oficina.tipo] || oficina.tipo);
        const oLat = oficina.coords[0];
        const oLng = oficina.coords[1];
        div.innerHTML += `
        <div class="oficinaItem">
            <div class="oficinaNome" onclick="irParaOficina(${oLat},${oLng})" style="cursor:pointer">
                ${nomeTipo} • ${oficina.nome}
            </div>
            <div class="oficinaDistancia">
                ${oficina.tipo}<br>
                📍 ${oficina.distancia.toFixed(1)} km
            </div>
            <div class="oficinaAcoes">
                <button type="button" class="btnRota btnRotaMaps"
                    onclick="abrirRotaGoogle(${lat},${lng},${oLat},${oLng})">
                    🗺️ Google Maps
                </button>
                <button type="button" class="btnRota btnRotaWaze"
                    onclick="abrirRotaWaze(${oLat},${oLng})">
                    📍 Waze
                </button>
                <button type="button" class="btnRota btnRotaCopiar"
                    onclick="copiarLinkRota(${lat},${lng},${oLat},${oLng},'${oficina.nome.replace(/'/g, "\'")}')">
                    📋 Copiar link
                </button>
            </div>
        </div>
        `;
    });

}

function irParaOficina(lat,lng){
    map.flyTo([lat,lng],15,{
        duration:1.5
    });
}

/** Rota Google Maps: caminhão → oficina (abre para enviar ao motorista) */
function abrirRotaGoogle(origLat, origLng, destLat, destLng) {
    const url = 'https://www.google.com/maps/dir/?api=1'
        + '&origin=' + encodeURIComponent(origLat + ',' + origLng)
        + '&destination=' + encodeURIComponent(destLat + ',' + destLng)
        + '&travelmode=driving';
    window.open(url, '_blank');
}

/** Abre navegação no Waze até a oficina */
function abrirRotaWaze(destLat, destLng) {
    const url = 'https://waze.com/ul?ll=' + destLat + '%2C' + destLng + '&navigate=yes';
    window.open(url, '_blank');
}

/** Copia link do Google Maps para colar no WhatsApp do motorista */
async function copiarLinkRota(origLat, origLng, destLat, destLng, nomeOficina) {
    const url = 'https://www.google.com/maps/dir/?api=1'
        + '&origin=' + encodeURIComponent(origLat + ',' + origLng)
        + '&destination=' + encodeURIComponent(destLat + ',' + destLng)
        + '&travelmode=driving';

    const texto = 'Rota até ' + (nomeOficina || 'oficina') + ':\n' + url;

    try {
        await navigator.clipboard.writeText(texto);
        alert('Link da rota copiado!\nCole no WhatsApp do motorista.');
    } catch (e) {
        // fallback
        prompt('Copie o link abaixo e envie ao motorista:', url);
    }
}
