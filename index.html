<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Filtroamb</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      background: #f4f6f8;
    }

    body { display: flex; }

    #sidebar {
      width: 340px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 8px rgba(0,0,0,.05);
      overflow-y: auto;
      height: 100vh;
      flex-shrink: 0;
    }

    .header {
      background: #0d5c2e;
      color: #fff;
      padding: 22px 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
    }

    .header p {
      margin: 6px 0 0;
      font-size: .85rem;
      opacity: .85;
    }

    .section { margin: 12px 16px; }

    details {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    summary {
      padding: 14px 18px;
      font-weight: 600;
      font-size: .95rem;
      cursor: pointer;
      background: #f8f9fa;
      border-radius: 8px;
      color: #0d5c2e;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem;
    }

    td {
      padding: 13px 18px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    td:hover { background: #f0f7f0; }

    .info {
      padding: 16px 18px;
      font-size: .82rem;
      color: #555;
      background: #f8f9fa;
    }

    .map-wrapper {
      position: relative;
      flex: 1;
      height: 100vh;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .fullscreen-btn {
      position: absolute;
      top: 12px;
      right: 150px;
      z-index: 1000;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }

    #statusFrota {
      position: absolute;
      bottom: 18px;
      left: 12px;
      z-index: 1000;
      background: rgba(13,92,46,.92);
      color: #fff;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: .78rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }

    .map-legend {
      position: absolute;
      top: 75px;
      left: 12px;
      z-index: 1000;
      background: rgba(255,255,255,.96);
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      min-width: 160px;
      font-size: .78rem;
    }

    .map-legend-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .map-legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
      color: #333;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
    }

    .map-legend-item:hover { background: #f0f4f0; }
    .map-legend-item.inativo { opacity: .35; }
    .map-legend-item.ativo-filtro {
      background: #e8f5e9;
      font-weight: 600;
    }

    .map-legend-color {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.2);
    }

    .map-legend-todos {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #e5e5e5;
      color: #0d5c2e;
      cursor: pointer;
      font-weight: 600;
    }

    #buscarPlaca {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cfcfcf;
      font-size: 15px;
      outline: none;
    }

    .btn-kml {
      width: 100%;
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #0d5c2e;
      background: #0d5c2e;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #painelCaminhao {
      position: absolute;
      top: 0;
      right: -360px;
      width: 340px;
      height: 100%;
      background: #fff;
      z-index: 1200;
      box-shadow: -5px 0 20px rgba(0,0,0,.18);
      transition: .35s;
      overflow-y: auto;
    }

    #painelCaminhao.ativo { right: 0; }

    #painelHeader {
      background: #0d5c2e;
      color: #fff;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
    }

    #fecharPainel {
      float: right;
      cursor: pointer;
    }

    .cardInfo {
      padding: 18px;
      border-bottom: 1px solid #ececec;
    }

    .cardTitulo {
      color: #777;
      font-size: 13px;
    }

    .cardValor {
      margin-top: 5px;
      font-size: 18px;
      font-weight: bold;
    }

    .oficinaItem {
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      background: #f7f7f7;
      border-left: 5px solid #0d5c2e;
    }

    .oficinaNome {
      font-weight: bold;
      font-size: 15px;
    }

    .oficinaDistancia {
      color: #666;
      margin-top: 4px;
      font-size: 13px;
    }

    .oficinaAcoes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .btnRota {
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }

    .btnRotaMaps { background: #1a73e8; }
    .btnRotaWaze { background: #33ccff; color: #0b3d4a; }
    .btnRotaCopiar { background: #0d5c2e; }

    .placa-tooltip {
      background: #0d5c2e;
      border: 1px solid #08451f;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 8px;
    }

    .gm-popup {
      width: 250px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>
  <div id="sidebar">
    <div class="header">
      <h1>Filtroamb-Unidades</h1>
      <p>Soluções Ambientais</p>
    </div>

    <div class="section">
      <input
        type="text"
        id="buscarPlaca"
        placeholder="🔍 Pesquisar placa..."
        onkeydown="if(event.key === 'Enter') pesquisarPlaca()">

      <button
        type="button"
        class="btn-kml"
        onclick="document.getElementById('inputKml').click()">
        📂 Importar KML Sascar
      </button>

      <input
        type="file"
        id="inputKml"
        accept=".kml,.kmz,application/vnd.google-earth.kml+xml"
        style="display:none"
        onchange="onKmlFileSelected(event)">
    </div>

    <div class="section">
      <details open>
        <summary>📍 Unidades</summary>
        <table id="unidadesTable"><tbody></tbody></table>
      </details>

      <details>
        <summary>🔧 Oficinas Parceiras</summary>
        <table id="oficinasTable"><tbody></tbody></table>
      </details>
    </div>

    <div class="info">Mapa Criado por: Victor E. Silveira</div>
  </div>

  <div class="map-wrapper">
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Tela cheia</button>

    <div class="map-legend">
      <div class="map-legend-title">Legenda</div>
      <div id="legend"></div>
    </div>

    <div id="map"></div>
    <div id="statusFrota">● Carregando frota...</div>

    <div id="painelCaminhao">
      <div id="painelHeader">
        🚚 Caminhão
        <span id="fecharPainel">✖</span>
      </div>

      <div class="cardInfo">
        <div class="cardTitulo">Placa</div>
        <div class="cardValor" id="infoPlaca">-</div>
      </div>

      <div class="cardInfo">
        <div class="cardTitulo">Cidade</div>
        <div class="cardValor" id="infoCidade">-</div>
      </div>

      <div class="cardInfo">
        <div class="cardTitulo">Ignição</div>
        <div class="cardValor" id="infoIgnicao">-</div>
      </div>

      <div class="cardInfo">
        <div class="cardTitulo">Velocidade</div>
        <div class="cardValor" id="infoVelocidade">-</div>
      </div>

      <div class="cardInfo">
        <div class="cardTitulo">Voltagem da bateria</div>
        <div class="cardValor" id="infoBateria">-</div>
      </div>

      <div class="cardInfo">
        <div class="cardTitulo">🔧 Oficinas próximas</div>
        <div id="listaOficinas"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([-26, -50], 6.5);

    const mapaPadrao = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap | Filtroamb' }
    ).addTo(map);

    const mapaSatelite = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { attribution: '© Esri, Maxar, Earthstar Geographics' }
    );

    L.control.layers({
      'Mapa padrão': mapaPadrao,
      'Satélite': mapaSatelite
    }, null, {
      collapsed: false,
      position: 'topright'
    }).addTo(map);

    let marcadoresCaminhoes = [];
    let caminhoes = [];
    let placaSelecionada = null;
    let circuloCaminhao = null;

    const iconeCaminhao = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3097/3097180.png',
      iconSize: [42, 42],
      iconAnchor: [21, 21],
      popupAnchor: [0, -20]
    });

    function decodeHtml(html) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = html;
      return textarea.value;
    }

    function normalizarTexto(texto) {
      return String(texto || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    function extrairCampo(descHtml, nome) {
      const html = decodeHtml(descHtml);
      const documento = new DOMParser().parseFromString(html, 'text/html');
      const nomeNormalizado = normalizarTexto(nome);

      for (const linha of documento.querySelectorAll('tr')) {
        const celulas = [...linha.querySelectorAll('td, th')];
        if (celulas.length < 2) continue;

        const label = normalizarTexto(celulas[0].textContent)
          .replace(/:$/, '');

        if (
          label === nomeNormalizado ||
          label.includes(nomeNormalizado) ||
          nomeNormalizado.includes(label)
        ) {
          return celulas
            .slice(1)
            .map(celula => celula.textContent.trim())
            .join(' ')
            .trim();
        }
      }

      return '';
    }

    function extrairBateria(descHtml) {
      const campos = [
        'Bateria (V)',
        'Bateria',
        'Voltagem da bateria',
        'Voltagem',
        'Tensão da bateria',
        'Tensão',
        'Battery',
        'Voltage'
      ];

      for (const campo of campos) {
        const valor = extrairCampo(descHtml, campo);
        if (valor) return valor;
      }

      const texto = normalizarTexto(decodeHtml(descHtml));
      const encontrada = texto.match(
        /(?:bateria|voltagem|tensao|battery|voltage)[^0-9]{0,40}([0-9]+(?:[,.][0-9]+)?)\s*v?/i
      );

      return encontrada ? encontrada[1] : '';
    }

    function formatarBateria(valor) {
      const texto = String(valor || '').trim();

      if (!texto || texto === '-' || texto === '—') {
        return 'Não informado';
      }

      return /v\b|volt/i.test(texto)
        ? texto
        : texto.replace(',', '.') + ' V';
    }

    function parseVelocidade(txt) {
      const match = String(txt || '').match(/([\d.,]+)/);
      return match
        ? parseFloat(match[1].replace(',', '.'))
        : 0;
    }

    function parseKmlSascar(kmlText) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(kmlText, 'text/xml');
      const placemarks = xml.getElementsByTagName('Placemark');
      const lista = [];

      for (const pm of placemarks) {
        const descNode = pm.getElementsByTagName('description')[0];
        const coordNode = pm.getElementsByTagName('coordinates')[0];

        if (!descNode || !coordNode) continue;

        const desc = descNode.textContent || '';
        const partes = coordNode.textContent.trim().split(',');

        if (partes.length < 2) continue;

        const lng = parseFloat(partes[0]);
        const lat = parseFloat(partes[1]);

        if (isNaN(lat) || isNaN(lng)) continue;

        const placa = extrairCampo(desc, 'Placa');
        if (!placa) continue;

        const municipio =
          extrairCampo(desc, 'Município') ||
          extrairCampo(desc, 'Municipio');

        const estado = extrairCampo(desc, 'Estado');
        const rua = extrairCampo(desc, 'Rua');
        const ignicao =
          extrairCampo(desc, 'Ignição') ||
          extrairCampo(desc, 'Ignicao');
        const velocidade = extrairCampo(desc, 'Velocidade');
        const data = extrairCampo(desc, 'Data');
        const motorista = extrairCampo(desc, 'Motorista');

        lista.push({
          placa: placa.toUpperCase(),
          cidade: [municipio, estado].filter(Boolean).join(' - ') || '—',
          rua: rua || '',
          lat,
          lng,
          ignicao: /ligada|on|sim/i.test(ignicao),
          velocidade: parseVelocidade(velocidade),
          data: data || '',
          motorista: motorista || '',
          bateria: extrairBateria(desc)
        });
      }

      return lista;
    }

    function popupCaminhao(c) {
      return `
        <b>🚚 ${c.placa}</b><br>
        📍 ${c.cidade}${c.rua ? '<br>🛣 ' + c.rua : ''}<br>
        ⚡ Ignição: ${c.ignicao ? 'Ligada' : 'Desligada'}<br>
        🏎️ Velocidade: ${c.velocidade} km/h<br>
        🔋 Bateria: ${formatarBateria(c.bateria)}
        ${c.data ? '<br>🕒 ' + c.data : ''}
      `;
    }

    function atualizarPainelSeAberto(c) {
      if (!placaSelecionada || placaSelecionada !== c.placa) return;

      document.getElementById('infoPlaca').innerText = c.placa;
      document.getElementById('infoCidade').innerText = c.cidade;
      document.getElementById('infoIgnicao').innerText =
        c.ignicao ? '🟢 Ligada' : '🔴 Desligada';
      document.getElementById('infoVelocidade').innerText =
        c.velocidade + ' km/h';
      document.getElementById('infoBateria').innerText =
        formatarBateria(c.bateria);
    }

    function limparMarcadoresCaminhoes() {
      marcadoresCaminhoes.forEach(item => map.removeLayer(item.marker));
      marcadoresCaminhoes = [];
    }

    function sincronizarMarcadores(lista) {
      caminhoes = lista;
      limparMarcadoresCaminhoes();

      lista.forEach(c => {
        const marker = L.marker([c.lat, c.lng], {
          icon: iconeCaminhao
        }).addTo(map);

        marker
          .bindPopup(popupCaminhao(c))
          .bindTooltip(c.placa, {
            direction: 'top',
            offset: [0, -22],
            className: 'placa-tooltip'
          });

        marker.on('click', () => abrirPainelCaminhao(c.placa));
        marcadoresCaminhoes.push({ placa: c.placa, marker });
        atualizarPainelSeAberto(c);
      });

      const status = document.getElementById('statusFrota');
      if (status) {
        status.textContent =
          `● Sascar KML · ${lista.length} veículos · ${new Date().toLocaleTimeString('pt-BR')}`;
      }
    }

    async function carregarVeiculosKML() {
      try {
        const resposta = await fetch(
          'https://frota3-filtroamb.github.io/Mapa-Filtro/dados/veiculos.kml',
          { cache: 'no-store' }
        );

        if (!resposta.ok) {
          console.error('Erro ao carregar KML:', resposta.status);
          return;
        }

        const lista = parseKmlSascar(await resposta.text());

        if (lista.length) {
          sincronizarMarcadores(lista);
        } else {
          console.warn('Nenhum veículo encontrado no KML.');
        }
      } catch (erro) {
        console.error('Erro ao carregar KML:', erro);
      }
    }

    function carregarFrotaDoKml(kmlText) {
      const lista = parseKmlSascar(kmlText);

      if (!lista.length) {
        alert('Nenhum veículo encontrado neste KML.');
        return;
      }

      sincronizarMarcadores(lista);
    }

    function onKmlFileSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => carregarFrotaDoKml(String(reader.result || ''));
      reader.readAsText(file);
    }

    function abrirPainelCaminhao(placa) {
      const dados = caminhoes.find(
        c => c.placa.toUpperCase() === placa.toUpperCase()
      );

      if (!dados) return;

      placaSelecionada = dados.placa.toUpperCase();

      if (circuloCaminhao) {
        map.removeLayer(circuloCaminhao);
      }

      circuloCaminhao = L.circle([dados.lat, dados.lng], {
        radius: 5000,
        color: '#0d5c2e',
        fillColor: '#0d5c2e',
        fillOpacity: .15,
        weight: 3
      }).addTo(map);

      map.flyToBounds(circuloCaminhao.getBounds(), {
        padding: [40, 40],
        duration: 1.2
      });

      const item = marcadoresCaminhoes.find(
        marcador => marcador.placa === placaSelecionada
      );

      if (item) item.marker.openPopup();

      document.getElementById('painelCaminhao').classList.add('ativo');
      document.getElementById('infoPlaca').innerText = dados.placa;
      document.getElementById('infoCidade').innerText = dados.cidade;
      document.getElementById('infoIgnicao').innerText =
        dados.ignicao ? '🟢 Ligada' : '🔴 Desligada';
      document.getElementById('infoVelocidade').innerText =
        dados.velocidade + ' km/h';
      document.getElementById('infoBateria').innerText =
        formatarBateria(dados.bateria);
    }

    function pesquisarPlaca() {
      const placa = document
        .getElementById('buscarPlaca')
        .value
        .trim()
        .toUpperCase();

      if (!placa) return;

      const caminhao = marcadoresCaminhoes.find(
        item => item.placa.includes(placa)
      );

      if (!caminhao) {
        alert('Caminhão não encontrado: ' + placa);
        return;
      }

      abrirPainelCaminhao(caminhao.placa);
    }

    document.getElementById('fecharPainel').onclick = () => {
      document.getElementById('painelCaminhao').classList.remove('ativo');
      placaSelecionada = null;

      if (circuloCaminhao) {
        map.removeLayer(circuloCaminhao);
        circuloCaminhao = null;
      }
    };

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    carregarVeiculosKML();
    setInterval(carregarVeiculosKML, 60000);

    setTimeout(() => map.invalidateSize(), 500);
  </script>
</body>
</html>
